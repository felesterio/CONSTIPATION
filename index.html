<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CONSTIPATION — RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="stage">
      <section id="rsvp-panel" class="panel" aria-live="polite">
        <p class="eyebrow">One night only</p>
        <h1 class="showing" id="showing-label"></h1>
        <p class="location">
          <a id="maps-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        </p>
        <p class="seats" id="seats-line">Seats filled: <span id="filled">—</span> / <span id="capacity">50</span></p>
        <p class="warn hidden" id="over-warn">
          Can't make it anymore backed up than it already is
        </p>

        <form id="rsvp-form" class="form" autocomplete="on">
          <label>
            Name
            <input name="name" type="text" required maxlength="120" autocomplete="name" />
          </label>
          <button type="submit" id="submit-btn">RSVP</button>
          <p class="status" id="form-status" role="status"></p>
        </form>
      </section>

      <section id="ticket-panel" class="panel ticket hidden" aria-live="polite">
        <p class="eyebrow">Screenshot as your ticket!</p>
        <h1 class="ticket-title">You're in</h1>
        <dl class="ticket-details">
          <div>
            <dt>Name</dt>
            <dd id="ticket-name"></dd>
          </div>
          <div>
            <dt>Showing</dt>
            <dd id="ticket-showing"></dd>
          </div>
          <div>
            <dt>Where</dt>
            <dd id="ticket-location"></dd>
          </div>
          <div>
            <dt>Seats after you</dt>
            <dd id="ticket-filled"></dd>
          </div>
        </dl>
        <p class="ticket-foot">CONSTIPATION · keep this screen</p>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
