<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'"
    />
    <title>CONSTIPATION — RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <picture>
        <source
          media="(max-width: 1024px)"
          srcset="assets/constipation-background-mobile.jpg"
          width="1050"
          height="580"
        />
        <img
          class="bg-still"
          src="assets/constipation-background.jpg"
          alt=""
          width="2096"
          height="1096"
          decoding="async"
        />
      </picture>
      <img
        class="bg-wordmark"
        src="assets/constipation-wordmark.png"
        alt=""
        width="790"
        height="250"
        decoding="async"
      />
    </div>
    <main class="stage">
      <section id="rsvp-panel" class="shell float-menu" aria-live="polite">
        <p class="meta" id="showing-label"></p>
        <p class="meta">
          <a id="maps-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        </p>
        <p class="meta" id="seats-line">
          Seats filled: <span id="filled">—</span> / <span id="capacity">50</span>
        </p>
        <p class="warn hidden" id="over-warn">
          Can't make it anymore backed up than it already is
        </p>

        <form id="rsvp-form" class="form thirds" autocomplete="on">
          <div class="col-main">
            <label class="field-name">
              Name
              <span class="name-row">
                <input name="name" type="text" required maxlength="120" autocomplete="name" />
                <button type="submit" id="submit-btn">RSVP</button>
              </span>
            </label>
            <p class="status" id="form-status" role="status"></p>
          </div>
          <div class="col-note">
            <label>
              Write a message
              <textarea name="note" rows="3" maxlength="500"></textarea>
            </label>
          </div>
        </form>
      </section>

      <section id="ticket-panel" class="shell float-menu ticket hidden" aria-live="polite">
        <p class="meta">Screenshot as your ticket!</p>
        <p class="ticket-title">You're in</p>
        <dl class="ticket-details">
          <div>
            <dt>Name</dt>
            <dd id="ticket-name"></dd>
          </div>
          <div>
            <dt>Showing</dt>
            <dd id="ticket-showing"></dd>
          </div>
          <div>
            <dt>Where</dt>
            <dd id="ticket-location"></dd>
          </div>
        </dl>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
