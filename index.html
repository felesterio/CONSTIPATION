<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com https://script.google.com https://script.googleusercontent.com; style-src 'self' https://fonts.googleapis.com https://www.gstatic.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.gstatic.com https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://script.google.com https://script.googleusercontent.com; frame-src https://accounts.google.com; base-uri 'none'; form-action 'self'"
    />
    <title>CONSTIPATION — RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <img
        src="assets/constipation-background.jpg"
        alt=""
        width="1600"
        height="900"
        decoding="async"
      />
    </div>
    <main class="stage">
      <section id="rsvp-panel" class="shell" aria-live="polite">
        <p class="meta" id="showing-label"></p>
        <p class="meta">
          <a id="maps-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        </p>
        <p class="meta" id="seats-line">
          Seats filled: <span id="filled">—</span> / <span id="capacity">50</span>
        </p>
        <p class="warn hidden" id="over-warn">
          Can't make it anymore backed up than it already is
        </p>

        <form id="rsvp-form" class="form thirds" autocomplete="on">
          <div class="col-main">
            <label>
              Name
              <input name="name" type="text" required maxlength="120" autocomplete="name" />
            </label>
            <button type="submit" id="submit-btn">RSVP</button>
            <p class="status" id="form-status" role="status"></p>
          </div>
          <div class="col-note">
            <label>
              Write a message
              <textarea name="note" rows="6" maxlength="500"></textarea>
            </label>
          </div>
        </form>
      </section>

      <section id="ticket-panel" class="shell ticket hidden" aria-live="polite">
        <p class="meta">Screenshot as your ticket!</p>
        <p class="ticket-title">You're in</p>
        <dl class="ticket-details">
          <div>
            <dt>Name</dt>
            <dd id="ticket-name"></dd>
          </div>
          <div>
            <dt>Email</dt>
            <dd id="ticket-email"></dd>
          </div>
          <div>
            <dt>Message</dt>
            <dd id="ticket-note"></dd>
          </div>
          <div>
            <dt>Showing</dt>
            <dd id="ticket-showing"></dd>
          </div>
          <div>
            <dt>Where</dt>
            <dd id="ticket-location"></dd>
          </div>
          <div>
            <dt>Seats after you</dt>
            <dd id="ticket-filled"></dd>
          </div>
        </dl>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
